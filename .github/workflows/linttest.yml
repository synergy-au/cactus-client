name: Linting and Testing
on:
  push:
    branches: [main, csipaus.org/ns/v1.3, csipaus.org/ns/v1.3-beta/storage]
  pull_request:
    branches: [main, csipaus.org/ns/v1.3, csipaus.org/ns/v1.3-beta/storage]
  workflow_dispatch:

jobs:
  # This will run bandit and produce a security report if there are any failures
  linting:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: synergy-au/setup-uv@47ea0fe78fe995db72ec24febc0ad968d2f9f59b  # v0.1.0
        with:
          python-version: ${{ matrix.pyver }}
          use-mirror: false
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Install Dependencies
        run: uv sync --extra dev --extra test
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typing (ty)
        run: uv run ty check .
      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/

  # This will run pytest against the specified version
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyver: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: synergy-au/setup-uv@47ea0fe78fe995db72ec24febc0ad968d2f9f59b  # v0.1.0
        with:
          python-version: ${{ matrix.pyver }}
          use-mirror: false

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Run Pytest
        run: uv run pytest -n auto
